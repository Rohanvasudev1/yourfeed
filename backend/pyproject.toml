[project]
name = "yourfeed-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "sqlmodel>=0.0.50",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

# Coverage gate for the assistant, accounts, youtube, user state, sharing and blends modules: `uv run pytest --cov=app.assistant --cov=app.accounts --cov=app.youtube --cov=app.user_state --cov=app.sharing --cov=app.blends`
[tool.coverage.report]
fail_under = 80
show_missing = true
