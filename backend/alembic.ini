# For the alembic CLI: `uv run alembic revision -m "..."`. The app migrates itself at startup (app/db.py).
[alembic]
script_location = migrations
# The CLI imports app.* from backend/.
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
