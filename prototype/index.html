<style>
/* ---------- Design tokens (light) ---------- */
:root{--ink-voice:color-mix(in srgb,var(--fill-brand) 30%,var(--text-primary));
--surface-0:#ffffff;--surface-1:#f2f2f2;--surface-2:#ffffff;
--text-primary:#0f0f0f;--text-secondary:#606060;--text-muted:#757575;
--border:rgba(0,0,0,.1);--border-strong:rgba(0,0,0,.16);--border-stronger:rgba(0,0,0,.35);
--bg-accent:#def1ff;--text-accent:#065fd4;--border-accent:#065fd4;--fill-accent:#065fd4;--fill-accent-hover:#0556bf;--on-accent:#ffffff;--bg-accent-muted:rgba(6,95,212,.06);
--bg-danger:#fdecea;--text-danger:#b3261e;--border-danger:#f2a7a1;
--bg-success:#e6f4ea;--text-success:#1e7e34;--border-success:#8fd19e;
--bg-warning:#fef4e5;--text-warning:#8a5300;--border-warning:#f0b357;
--fill-brand:#C96442;--on-brand:#ffffff;
--fill-primary:#0f0f0f;--on-primary:#ffffff;
--fill-control:rgba(0,0,0,.1);
--radius:8px;
--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;

}
/* ---------- Design tokens (dark) ---------- */
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--surface-0:#0f0f0f;--surface-1:#272727;--surface-2:#212121;
--text-primary:#f1f1f1;--text-secondary:#aaaaaa;--text-muted:#8c8c8c;
--border:rgba(255,255,255,.1);--border-strong:rgba(255,255,255,.18);--border-stronger:rgba(255,255,255,.4);
--bg-accent:#263850;--text-accent:#3ea6ff;--border-accent:#3ea6ff;--fill-accent:#3ea6ff;--fill-accent-hover:#65b8ff;--on-accent:#0f0f0f;--bg-accent-muted:rgba(62,166,255,.1);
--bg-danger:#4a1714;--text-danger:#ff8a80;--border-danger:#b3261e;
--bg-success:#16301d;--text-success:#81c995;--border-success:#1e7e34;
--bg-warning:#3d2a0a;--text-warning:#fdd663;--border-warning:#8a5300;
--fill-primary:#f1f1f1;--on-primary:#0f0f0f;
--fill-control:rgba(255,255,255,.16);
}}
:root[data-theme="dark"]{
--surface-0:#0f0f0f;--surface-1:#272727;--surface-2:#212121;
--text-primary:#f1f1f1;--text-secondary:#aaaaaa;--text-muted:#8c8c8c;
--border:rgba(255,255,255,.1);--border-strong:rgba(255,255,255,.18);--border-stronger:rgba(255,255,255,.4);
--bg-accent:#263850;--text-accent:#3ea6ff;--border-accent:#3ea6ff;--fill-accent:#3ea6ff;--fill-accent-hover:#65b8ff;--on-accent:#0f0f0f;--bg-accent-muted:rgba(62,166,255,.1);
--bg-danger:#4a1714;--text-danger:#ff8a80;--border-danger:#b3261e;
--bg-success:#16301d;--text-success:#81c995;--border-success:#1e7e34;
--bg-warning:#3d2a0a;--text-warning:#fdd663;--border-warning:#8a5300;
--fill-primary:#f1f1f1;--on-primary:#0f0f0f;
--fill-control:rgba(255,255,255,.16);
}
/* ---------- Base element styles ---------- */
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.5}
#app{max-width:1120px;margin:0 auto;padding:24px 16px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
button{font:inherit;color:var(--text-primary);background:transparent;border:0.5px solid var(--border-strong);border-radius:var(--radius);height:36px;padding:0 14px;cursor:pointer;transition:background .12s}
button:hover{background:var(--surface-1)}
button:active{transform:scale(.98)}
button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--bg-accent)}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--text-primary);background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:var(--radius);height:36px;padding:0 10px}
input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{outline:none;border-color:var(--border-accent);box-shadow:0 0 0 3px var(--bg-accent)}
input::placeholder{color:var(--text-muted)}
p{margin:0}

/* ---------- App styles ---------- */
.pn{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px}
.lb{font-size:12px;color:var(--text-muted);margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.tp{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 6px 4px 10px;border-radius:999px;background:var(--bg-accent);color:var(--text-accent)}
.tp.mu{background:var(--surface-1);color:var(--text-muted);text-decoration:line-through}
.tp button{border:none;background:transparent;padding:0;width:16px;height:16px;min-height:0;display:flex;align-items:center;justify-content:center;color:inherit;cursor:pointer}
.tg{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;cursor:pointer}
.sw{width:28px;height:16px;border-radius:999px;background:var(--fill-control);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--surface-2);transition:left .15s}
.sw.on{background:var(--fill-accent)}.sw.on::after{left:14px}
.dr{position:relative;height:22px}
.dr .trk{position:absolute;top:9px;left:0;right:0;height:4px;border-radius:2px;background:var(--fill-control)}
.dr .fl{position:absolute;height:100%;background:var(--fill-accent);border-radius:2px}
.dr input{position:absolute;left:0;top:0;width:100%;height:22px;margin:0;background:transparent;pointer-events:none;-webkit-appearance:none;appearance:none}
.dr input::-webkit-slider-runnable-track{background:transparent;height:4px;border:none}
.dr input::-moz-range-track{background:transparent;border:none}
.dr input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--fill-accent);margin-top:-6px;cursor:pointer}
.dr input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--fill-accent);cursor:pointer}
.rin{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);margin-top:6px}
.rin input{width:46px;height:24px;font-size:11px;padding:0 4px;text-align:center}
.tab{font-size:13px;padding:6px 12px;border-radius:var(--radius);cursor:pointer;color:var(--text-secondary);display:inline-flex;gap:5px;align-items:center;border:0.5px solid transparent}
.tab.on{background:var(--surface-2);color:var(--text-primary);border-color:var(--border)}
button.tab{background:transparent;height:auto;min-height:0;font:inherit;font-size:13px}
.tab.texp[aria-expanded=true]{background:var(--surface-2)}
.wact.xitem{height:auto;min-height:44px;padding:6px 8px;align-items:center;gap:10px;line-height:1.3}
.wact.xitem.on{background:var(--surface-1)}
.tab.sel{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.tab.tmp{border:0.5px dashed var(--border-strong)}
.tab[draggable=true]{cursor:grab}
.tab.over{box-shadow:-2px 0 0 var(--fill-accent)}
.vc{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;padding:10px;border-radius:12px;background:var(--surface-2);border:0.5px solid var(--border);align-items:start}
.gc{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:12px;background:var(--surface-2);border:0.5px solid var(--border);min-width:0;height:100%}
.gc.sel{border:1.5px solid var(--border-accent);padding:7px}
.gc>.watch{height:auto!important;aspect-ratio:16/9;flex:none}
.yt{position:relative;overflow:hidden;border-radius:8px;container-type:inline-size;isolation:isolate;background:#111;color:#fff}
.ytbg{position:absolute;inset:0;z-index:-1}
.ytbg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 45%,rgba(255,255,255,.28),transparent 45%),linear-gradient(0deg,rgba(0,0,0,.28),transparent 45%)}
.ytart{position:absolute;inset:0;display:flex;align-items:center;gap:2cqw;padding:0 4cqw 0 5cqw;transition:transform .25s ease}
.watch.yt:hover .ytart,.watch.yt:hover .ytvs{transform:scale(1.04)}
.yttx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2cqw}
.yt1{font:900 11.5cqw/.95 Impact,"Arial Black","Helvetica Neue",Arial,sans-serif;letter-spacing:.01em;color:#fff;-webkit-text-stroke:.5cqw #000;paint-order:stroke fill;text-shadow:0 .8cqw 0 rgba(0,0,0,.55),0 0 3cqw rgba(0,0,0,.35);overflow-wrap:anywhere}
.yt2{font:900 6cqw/1 Impact,"Arial Black",Arial,sans-serif;text-transform:uppercase;color:#111;background:var(--acc,#ffd400);padding:.8cqw 2cqw;border-radius:1cqw;transform:rotate(-3deg);box-shadow:0 .8cqw 0 rgba(0,0,0,.35);white-space:nowrap}
.ytic{font-size:34cqw;line-height:1;color:#fff;flex:none;transform:rotate(-8deg);filter:drop-shadow(0 1.5cqw 2cqw rgba(0,0,0,.5))}
.ytring{position:absolute;right:1cqw;top:50%;width:40cqw;height:40cqw;transform:translateY(-50%);border:1.6cqw solid #ff1a1a;border-radius:50%;box-shadow:0 0 0 .5cqw rgba(255,255,255,.7)}
.ytarrow{position:absolute;right:38cqw;bottom:6cqw;font-size:15cqw;color:#ff1a1a;transform:rotate(-25deg);filter:drop-shadow(0 0 .5cqw #fff) drop-shadow(0 1cqw 1cqw rgba(0,0,0,.5))}
.ytvs{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;transition:transform .25s ease}
.ytvs>div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;background-image:linear-gradient(0deg,rgba(0,0,0,.3),transparent 50%)}
.ytvs i{font-size:22cqw;line-height:1;filter:drop-shadow(0 1cqw 1.5cqw rgba(0,0,0,.5))}
.ytvs b{font:900 10cqw/1 Impact,"Arial Black",Arial,sans-serif;-webkit-text-stroke:.4cqw #000;paint-order:stroke fill}
.ytvsx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);font:900 9cqw/1 Impact,"Arial Black",Arial,sans-serif;color:#111;background:#ffd400;padding:1.5cqw 2.5cqw;border-radius:2cqw;box-shadow:0 1cqw 0 rgba(0,0,0,.4)}
.ytdur,.ytrank,.ytw{position:absolute;z-index:2;background:rgba(0,0,0,.8);color:#fff;font:500 clamp(9px,4.4cqw,12px)/1 Roboto,Arial,sans-serif;padding:3px 4px;border-radius:4px;letter-spacing:.02em}
.ytdur{right:4px;bottom:4px}
.ytlive{background:#cc0000;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.yt:has(.ytprog) .ytdur,.yt:has(.ytprog) .ytw{bottom:8px}
.ytrank{left:4px;top:4px;font-weight:700}
.ytw{left:4px;bottom:4px;text-transform:uppercase;font-size:clamp(8px,3.8cqw,11px)}
@container (max-width:180px){.ytw{display:none}.yt2{display:none}}
.ytprog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.35);z-index:2}
.ytprog i{display:block;height:100%;width:100%;background:#f00}
.ytgrip{position:absolute;left:4px;top:4px;z-index:2;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:13px}
.gc .gbody{flex:1;min-width:0;display:flex;flex-direction:column}
.gc .gbody>.watch{min-height:calc(2 * 1.35em);font-size:14px}
.gc .gmeta>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-top:8px;border-top:0.5px solid var(--border);margin-top:auto}
.gc .acts .ib{width:100%;min-width:0}
.dbox{margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--surface-1);font-size:12px;line-height:1.45;color:var(--text-secondary);cursor:pointer}
.dbox:hover{background:color-mix(in srgb,var(--surface-1) 85%,var(--text-primary))}
.dbox .dtext{margin:0}
.dmore{display:inline-block;margin-top:2px;font-weight:500;color:var(--text-primary);font-size:12px}
.dfull{white-space:pre-line;font-size:13px;line-height:1.5;color:var(--text-secondary)}
.dbox.open{cursor:default}.dbox.open .dmore{cursor:pointer}
.gdesc{display:flex;align-items:center;gap:6px;margin-top:6px;padding:4px 8px;border-radius:6px;background:var(--surface-1);font-size:12px;color:var(--text-secondary);cursor:pointer}
.gdesc span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gdesc i{font-size:14px;color:var(--text-muted);flex:none}
.gdesc:hover,.gdesc[aria-expanded=true]{color:var(--text-primary)}
.dpanel{padding:8px 2px 4px}
.shlist{display:flex;flex-direction:column;gap:2px;max-height:232px;overflow-y:auto;padding:4px;border-radius:10px;background:var(--surface-1);border:0.5px solid var(--border);margin-bottom:12px}
.shrow{display:flex;gap:8px;align-items:center;min-width:0;padding:4px 6px;border-radius:6px;cursor:pointer}
.shrow:hover{background:var(--surface-2)}
.shrow input{flex:none;margin:0;width:16px;height:16px;accent-color:var(--fill-accent)}
.shrow .shtitle{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shrow.off .shtitle,.shrow.off span{opacity:.45}
.shrow.off .shtitle{text-decoration:line-through}
.shcard{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2);border:0.5px solid var(--border);cursor:pointer}
.shcard:hover{border-color:var(--border-strong)}
.shcard.new{border-color:var(--border-accent)}
.newdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fill-accent);margin-left:6px;vertical-align:middle}
.shnote{font-family:var(--font-voice);font-size:14px;color:var(--text-primary);margin-top:6px;line-height:1.45}
.shstrip{display:grid;grid-template-columns:repeat(4,72px);gap:6px;margin-top:8px}
.shtheirs{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--surface-1);display:flex;flex-direction:column;gap:4px}
.tclose{width:18px;height:18px;min-height:0;padding:0;margin:0 -4px 0 2px;border:none;border-radius:50%;background:transparent;color:var(--text-muted);display:inline-flex;align-items:center;justify-content:center;font-size:12px;opacity:0;transition:opacity .12s,background .12s;flex:none}
.tab:hover .tclose,.tab:focus-within .tclose,.xitem:hover .tclose,.xitem:focus-visible .tclose,.tclose:focus-visible{opacity:1}
.tclose:hover{background:var(--fill-control);color:var(--text-primary)}
.xclose{margin-left:6px}
.tdot{width:7px;height:7px;border-radius:50%;background:var(--fill-accent);margin-left:2px;flex:none}
.tcount{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--fill-accent);color:var(--on-accent);font-size:11px;font-weight:500;margin-left:4px}
.gpanel{grid-column:1/-1;padding:4px 10px 8px;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--border-accent)}
.gpanel .row{border-top:none}
.vc[draggable=true]{cursor:grab}
.ib{width:32px;height:32px;padding:0;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;flex:none}
.ib.on{background:var(--fill-accent);color:var(--on-accent);border-color:var(--fill-accent)}
.ib.soft{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.fc{font-size:12px;padding:4px 10px;border-radius:999px;border:0.5px solid var(--border-strong);background:var(--surface-2);cursor:pointer;color:var(--text-primary);display:inline-flex;gap:4px;align-items:center}
.fc.pk{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.fr{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:14px;cursor:pointer;border-radius:var(--radius)}
.fr:hover{background:var(--surface-2)}
.chev{transition:transform .15s;color:var(--text-muted);font-size:14px}
.chev.open{transform:rotate(90deg)}
.row{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 6px;border-top:0.5px solid var(--border);scroll-snap-type:x mandatory}
.mini{flex:none;width:150px;scroll-snap-align:start}
.seg{display:inline-flex;background:var(--surface-2);border:0.5px solid var(--border);border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{border:none;background:transparent;border-radius:999px;font-size:13px;padding:5px 12px;height:auto;min-height:0;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center}
.seg button.on{background:var(--fill-primary);color:var(--on-primary)}
.recipe{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:13px;color:var(--text-secondary);margin:-2px 2px 12px}
.recipe:empty{display:none}
.tok{border:none;background:transparent;padding:2px 5px;margin:0 -3px;height:auto;min-height:0;font:inherit;font-weight:500;color:var(--text-primary);border-radius:6px;text-decoration:underline dotted;text-decoration-color:var(--text-muted);text-underline-offset:4px;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.tok:hover,.tok[aria-expanded=true]{background:var(--surface-2);text-decoration-color:var(--text-accent);color:var(--text-accent)}
.pop{position:absolute;z-index:40;width:290px;max-width:calc(100vw - 16px);background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:12px;padding:12px;box-shadow:0 12px 28px rgba(0,0,0,.3);animation:popin .12s ease-out}
.pop[hidden]{display:none}
@keyframes popin{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.pophint{font-size:11px;color:var(--text-muted);margin:8px 0 0;line-height:1.4}
.wtok{cursor:pointer;border-radius:4px;text-decoration:underline dotted transparent;text-underline-offset:3px}
.wtok:hover,.wtok:focus-visible,.wtok[aria-expanded=true]{color:var(--text-primary);text-decoration-color:var(--text-muted)}
.wpop-h{font-size:14px;font-weight:500;margin:0}
.wpop-s{font-size:12px;color:var(--text-muted);margin:2px 0 10px}
.wact{display:flex;width:100%;align-items:center;gap:8px;border:none;background:transparent;height:32px;padding:0 8px;border-radius:8px;font-size:13px;color:var(--text-primary);text-align:left}
.wact:hover{background:var(--surface-1)}
.wact i{font-size:16px;color:var(--text-secondary)}

.acct:hover,.acct[aria-expanded=true]{box-shadow:0 0 0 3px var(--bg-accent)}
.acchead{display:flex;align-items:center;gap:10px;padding:2px 4px 10px;border-bottom:0.5px solid var(--border);margin-bottom:6px}
.acchead .acct{width:40px;height:40px;font-size:17px;cursor:default;box-shadow:none}
.wact .n{margin-left:auto;font-size:12px;color:var(--text-muted)}
.swrap{position:relative;flex:0 1 280px;display:flex;min-width:160px;transition:flex-basis .2s ease}
.swrap:focus-within{flex-basis:420px}
.sbar.open{border-radius:20px 20px 0 0;border-color:var(--border-strong);border-bottom-color:transparent;background:var(--surface-2)}
#sugg{position:absolute;top:35px;left:0;right:0;z-index:30;background:var(--surface-2);border:1px solid var(--border-strong);border-top:none;border-radius:0 0 20px 20px;padding:0 0 10px;box-shadow:0 10px 24px rgba(0,0,0,.28)}
#sugg::before{content:"";display:block;height:1px;margin:0 16px 8px;background:var(--border)}
.sug{display:flex;align-items:center;gap:12px;padding:0 6px 0 18px;height:34px;cursor:pointer;font-size:15px;color:var(--text-primary)}
.sug.act,.sug:hover{background:var(--surface-1)}
.sug .ic{font-size:17px;color:var(--text-muted);flex:none}
.sug .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .tx b{font-weight:600}
.sug.rec .tx{color:var(--text-accent)}
.sug .sb{border:none;background:transparent;width:28px;height:28px;min-height:0;padding:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted);border-radius:50%;flex:none}

// Google-style autocomplete. Suggestions come from titles, channels and topics; recent searches come first.
// Weight = summed views, so short popular queries (topics, channels) outrank single long titles, as on Google.
const SUGG_CORPUS=(()=>{const m=new Map();const add=(p,w)=>{const k=p.toLowerCase().replace(/\s+/g," ").trim();if(k)m.set(k,(m.get(k)||0)+w)};V.forEach(v=>{add(v.t,v.vn);if(v.h!==v.t)add(v.h,v.vn);add(v.ch,v.vn);add(v.tp,v.vn*2);add(v.tp+" "+v.ch.toLowerCase(),v.vn/4)});return [...m].map(([p,w])=>({p,w}))})();
let ac={items:[],active:-1,typed:""};
const suggScore=x=>x.w/(1+(x.p.split(" ").length-1)*0.5);
const byScore=(a,b)=>suggScore(b)-suggScore(a);
function suggestFor(raw){
const q=raw.toLowerCase().replace(/\s+/g," ").trimStart();
const rec=s.recent.filter(r=>!q||r.startsWith(q)).map(p=>({p,rec:true}));
if(!q)return rec.slice(0,SUGG_MAX);
const wordHit=p=>p.split(" ").some((_,i,a)=>a.slice(i).join(" ").startsWith(q));
const seen=new Set(rec.map(r=>r.p));
const pre=SUGG_CORPUS.filter(x=>x.p.startsWith(q)&&!seen.has(x.p)).sort(byScore);
const mid=SUGG_CORPUS.filter(x=>!x.p.startsWith(q)&&wordHit(x.p)&&!seen.has(x.p)).sort(byScore);
return [...rec,...pre,...mid].slice(0,SUGG_MAX).map(x=>({p:x.p,rec:!!x.rec}));
}
function boldRest(p,typed){
const q=typed.toLowerCase().trim();if(!q)return esc(p);
const i=p.indexOf(q);if(i<0)return `<b>${esc(p)}</b>`;
return `${i?`<b>${esc(p.slice(0,i))}</b>`:""}${esc(p.slice(i,i+q.length))}<b>${esc(p.slice(i+q.length))}</b>`;
}
function paintSugg(){
const box=$("sugg"),inp=$("q"),open=ac.items.length>0;
box.hidden=!open;$("sbar").classList.toggle("open",open);inp.setAttribute("aria-expanded",String(open));
if(!open){box.innerHTML="";inp.removeAttribute("aria-activedescendant");return}
box.innerHTML=ac.items.map((x,i)=>`<div class="sug${x.rec?" rec":""}${i===ac.active?" act":""}" id="sug-${i}" role="option" aria-selected="${i===ac.active}" data-sug="${i}"><i class="ti ${x.rec?"ti-history":"ti-search"} ic" aria-hidden="true"></i><span class="tx">${boldRest(x.p,ac.typed)}</span>${x.rec?`<button class="sb" data-sugrm="${i}" tabindex="-1" aria-label="Remove ${esc(x.p)} from recent searches" title="Remove"><i class="ti ti-x" style="font-size:15px" aria-hidden="true"></i></button>`:""}<button class="sb" data-sugfill="${i}" tabindex="-1" aria-label="Fill in ${esc(x.p)}" title="Fill in"><i class="ti ti-arrow-up-left" style="font-size:16px" aria-hidden="true"></i></button></div>`).join("");
if(ac.active>=0)inp.setAttribute("aria-activedescendant","sug-"+ac.active);else inp.removeAttribute("aria-activedescendant");
on("[data-sug]",e=>e.onmousedown=ev=>{if(ev.target.closest(".sb"))return;ev.preventDefault();inp.value=ac.items[+e.dataset.sug].p;search()});
on("[data-sugfill]",e=>e.onmousedown=ev=>{ev.preventDefault();ev.stopPropagation();const v=ac.items[+e.dataset.sugfill].p+" ";inp.value=v;openSugg(v)});
on("[data-sugrm]",e=>e.onmousedown=ev=>{ev.preventDefault();ev.stopPropagation();const p=ac.items[+e.dataset.sugrm].p;s={...s,recent:s.recent.filter(r=>r!==p)};openSugg(inp.value)});
}
function openSugg(typed){ac={items:suggestFor(typed),active:-1,typed};paintSugg()}
function closeSugg(){ac={items:[],active:-1,typed:ac.typed};paintSugg()}
function moveSugg(d){
if(!ac.items.length){openSugg($("q").value);return}
const n=ac.items.length,next=ac.active+d<-1?n-1:ac.active+d>=n?-1:ac.active+d;
ac={...ac,active:next};$("q").value=next<0?ac.typed:ac.items[next].p;paintSugg();
}
const search=()=>{const q=$("q").value.trim();closeSugg();if(!q)return;const k=q.toLowerCase().replace(/\s+/g," ");$("q").blur();
s={...s,recent:[k,...s.recent.filter(r=>r!==k)].slice(0,RECENT_MAX)};up({q,page:"search",saving:null,editing:false})};
$("qgo").onclick=search;
$("q").addEventListener("keydown",e=>{
if(e.key==="Enter"){e.preventDefault();search()}
else if(e.key==="ArrowDown"){e.preventDefault();moveSugg(1)}
else if(e.key==="ArrowUp"){e.preventDefault();moveSugg(-1)}
else if(e.key==="Escape"&&ac.items.length){e.preventDefault();$("q").value=ac.typed;closeSugg()}});
$("q").addEventListener("input",e=>openSugg(e.target.value));

$("q").addEventListener("blur",()=>closeSugg());

s={...s,blends:DEMO_BLENDS.map(tasteOf),inbox:DEMO_INBOX};
